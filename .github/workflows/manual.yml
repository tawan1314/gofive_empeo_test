name: Run Manual
on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser'
        default: 'All'
        options:
            - All
            - chromium
            - firefox
            - webkit
        required: true
        type: choice
      scenario:
        description: 'Scenario (File name ex.SC01_E2E_Flow.spec.ts)'
        required: false
        type: string
      testcase:
        description: 'TestCase (Testcase name ex.TC_REG_01-Register successfully with valid info)'
        required: false
        type: string
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
            BROWSER=""
            if [ "${{ github.event.inputs.browser }}" != "All" ]; then
                BROWSER="--project=${{ github.event.inputs.browser }}"
            fi

            SCENARIO=""
            if [ -n "${{ github.event.inputs.scenario }}" ]; then
                SCENARIO="tests/${{ github.event.inputs.scenario }}"
            fi

            TESTCASE=""
            if [ -n "${{ github.event.inputs.testcase }}" ]; then
                TESTCASE="-g '${{ github.event.inputs.testcase }}'"
            fi

            if [ -n "$SCENARIO" ] || [ -n "$TESTCASE" ]; then
                echo "Running with -> Scenario: $SCENARIO | TestCase: $TESTCASE | Browser: ${{ github.event.inputs.browser }}"
                npx playwright test $SCENARIO $TESTCASE $BROWSER
            else
                echo "Running all tests..."
                npx playwright test $BROWSER
            fi
        env:
          SCENARIO: ${{ github.event.inputs.scenario }}
          TESTCASE: ${{ github.event.inputs.testcase }}
          BROWSER: ${{ github.event.inputs.browser }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30