name: Run Manual - Gofive - Empeo
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario'
        options:
            - All
            - E2E_Flow
            - RegisterFieldValidation
            - OTPValidation
            - CreatePasswordValidation
        default: 'All'
        required: true
        type: choice
      testcase:
        description: 'TestCase (optional)'
        required: false
        type: string
      branch:
        description: 'Branch'
        default: 'main'
        required: true
        type: string
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
            if [ -n "${{ github.event.inputs.testcase }}" ]; then
                echo "Running specific test case matching: ${{ github.event.inputs.testcase }}"
                npx playwright test -g "${{ github.event.inputs.testcase }}"
            else
                echo "Running all tests..."
                npx playwright test
            fi
        env:
          SCENARIO: ${{ github.event.inputs.scenario }}
          TESTCASE: ${{ github.event.inputs.testcase }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30