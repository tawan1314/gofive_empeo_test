name: Run Manual
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario'
        options:
            - All
            - E2E_Flow
            - RegisterFieldValidation
            - OTPValidation
            - CreatePasswordValidation
        default: 'All'
        required: true
        type: choice
      testcase:
        description: 'TestCase (optional)'
        required: false
        type: string
      browser:
        description: 'Browser'
        default: 'All'
        options:
            - All
            - chromium
            - firefox
            - webkit
        required: true
        type: choice
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
            BROWSER=""
            if [ "${{ github.event.inputs.browser }}" != "All" ]; then
                BROWSER="--project=${{ github.event.inputs.browser }}"
            fi

            if [ -n "${{ github.event.inputs.testcase }}" ]; then
                echo "Running specific test case matching: ${{ github.event.inputs.testcase }}"
                npx playwright test -g "${{ github.event.inputs.testcase }}" $BROWSER
            else
                echo "Running all tests..."
                npx playwright test $BROWSER
            fi
        env:
          SCENARIO: ${{ github.event.inputs.scenario }}
          TESTCASE: ${{ github.event.inputs.testcase }}
          BROWSER: ${{ github.event.inputs.browser }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30